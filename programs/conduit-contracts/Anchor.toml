[toolchain]
# Pin to match the anchor-lang dependency in the programs' Cargo.toml so local
# and CI `anchor build` use the same CLI (avoids "anchor-cli X is not installed").
anchor_version = "1.0.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
escrow = "8vH1iEpbwe31WGqSGd9a8qkKh7SCHW8MsaSULVsxskRw"
registry = "XGXadfKb7mru5wcr1yUZWSeBLVUY6NFDAriBUUMiLbk"

[programs.localnet]
escrow = "8vH1iEpbwe31WGqSGd9a8qkKh7SCHW8MsaSULVsxskRw"
registry = "XGXadfKb7mru5wcr1yUZWSeBLVUY6NFDAriBUUMiLbk"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]
